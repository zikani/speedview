name: SpeedView Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Optional version label for manual test builds (does not create a Git tag)"
        required: false
        default: "manual-build"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Binary (PyInstaller)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Qt5, Xvfb, and binutils dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            xvfb \
            xauth \
            libgl1 \
            libegl1 \
            libdbus-1-3 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0

      - name: Install Python dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify bytecode & run unit tests under Xvfb
        run: |
          python -m compileall -q main.py speedview tests
          xvfb-run -a python -m unittest discover -s tests -v

      - name: Build standalone Linux binary with PyInstaller
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --windowed \
            --name SpeedView-linux-x64 \
            --collect-submodules speedview \
            --hidden-import PyQt5.QtSvg \
            --hidden-import PyQt5.QtXml \
            main.py
          chmod +x dist/SpeedView-linux-x64
          tar -C dist -czf dist/SpeedView-linux-x64.tar.gz SpeedView-linux-x64
          (cd dist && python -m zipfile -c SpeedView-linux-x64.zip SpeedView-linux-x64)
          (cd dist && sha256sum SpeedView-linux-x64 SpeedView-linux-x64.tar.gz SpeedView-linux-x64.zip > SpeedView-linux-x64.sha256)

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: speedview-linux-x64
          path: |
            dist/SpeedView-linux-x64
            dist/SpeedView-linux-x64.tar.gz
            dist/SpeedView-linux-x64.zip
            dist/SpeedView-linux-x64.sha256

  build-windows:
    name: Build Windows Executable (PyInstaller)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify bytecode & run unit tests
        run: |
          python -m compileall -q main.py speedview tests
          python -m unittest discover -s tests -v

      - name: Build standalone Windows SpeedView.exe & .zip with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean speedview.spec
          Compress-Archive -Path dist\SpeedView.exe -DestinationPath dist\SpeedView-windows-x64.zip -Force
          $exeHash = (Get-FileHash -Algorithm SHA256 dist\SpeedView.exe).Hash.ToLower()
          $zipHash = (Get-FileHash -Algorithm SHA256 dist\SpeedView-windows-x64.zip).Hash.ToLower()
          @(
            "$exeHash  SpeedView.exe"
            "$zipHash  SpeedView-windows-x64.zip"
          ) | Out-File -Encoding ascii dist\SpeedView-windows-x64.sha256

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: speedview-windows-x64
          path: |
            dist/SpeedView.exe
            dist/SpeedView-windows-x64.zip
            dist/SpeedView-windows-x64.sha256

  build-macos:
    name: Build macOS App Bundle (PyInstaller)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify bytecode & run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q main.py speedview tests
          python -m unittest discover -s tests -v

      - name: Build standalone macOS .app.zip with PyInstaller
        run: |
          pyinstaller --noconfirm --clean speedview.spec
          ditto -c -k --keepParent dist/SpeedView.app dist/SpeedView-macos.zip
          (cd dist && shasum -a 256 SpeedView-macos.zip > SpeedView-macos.zip.sha256)

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: speedview-macos
          path: |
            dist/SpeedView-macos.zip
            dist/SpeedView-macos.zip.sha256

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lh release-assets

      - name: Create GitHub Release and attach binaries
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-assets/SpeedView.exe
            release-assets/SpeedView-windows-x64.zip
            release-assets/SpeedView-windows-x64.sha256
            release-assets/SpeedView-linux-x64
            release-assets/SpeedView-linux-x64.tar.gz
            release-assets/SpeedView-linux-x64.zip
            release-assets/SpeedView-linux-x64.sha256
            release-assets/SpeedView-macos.zip
            release-assets/SpeedView-macos.zip.sha256
