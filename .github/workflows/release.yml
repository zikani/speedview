name: SpeedView Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Optional version label for manual test builds (does not create a Git tag)"
        required: false
        default: "manual-build"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Package (PyInstaller)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Qt5, Xvfb, and binutils dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            xvfb \
            xauth \
            libgl1 \
            libegl1 \
            libdbus-1-3 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0

      - name: Install Python dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify bytecode & run unit tests under Xvfb
        run: |
          python -m compileall -q main.py installer.py speedview tests
          xvfb-run -a python -m unittest discover -s tests -v

      - name: Build Linux onedir bundle & Setup binary with PyInstaller
        run: |
          pyinstaller --noconfirm --clean speedview.spec
          chmod +x dist/SpeedView/SpeedView
          tar -C dist -czf dist/SpeedView-linux-x64.tar.gz SpeedView
          (cd dist/SpeedView && python -m zipfile -c ../SpeedView-linux-x64.zip .)
          pyinstaller --noconfirm --clean speedview_installer.spec
          chmod +x dist/SpeedView-Setup
          mv dist/SpeedView-Setup dist/SpeedView-linux-x64-Setup
          (cd dist && sha256sum SpeedView-linux-x64.tar.gz SpeedView-linux-x64.zip SpeedView-linux-x64-Setup > SpeedView-linux-x64.sha256)

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: speedview-linux-x64
          path: |
            dist/SpeedView-linux-x64.tar.gz
            dist/SpeedView-linux-x64.zip
            dist/SpeedView-linux-x64-Setup
            dist/SpeedView-linux-x64.sha256

  build-windows:
    name: Build Windows App, GUI Setup & MSI (PyInstaller + WiX)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install WiX Toolset v4 for GUI MSI builds
        run: |
          dotnet tool install --global wix --version 4.0.5
          wix extension add -g WixToolset.UI.wixext/4.0.5

      - name: Verify bytecode & run unit tests
        run: |
          python -m compileall -q main.py installer.py speedview tests
          python -m unittest discover -s tests -v

      - name: Build onedir SpeedView, GUI Setup.exe, MSI, & .zip
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean speedview.spec
          pyinstaller --noconfirm --clean speedview_installer.spec
          $AppVersion = (python -c "from speedview.config.config import APP_VERSION; print(APP_VERSION)").Trim()
          wix build installer\windows\SpeedView.wxs -ext WixToolset.UI.wixext -d "AppVersion=$AppVersion" -arch x64 -o dist\SpeedView-windows-x64.msi
          Compress-Archive -Path dist\SpeedView\* -DestinationPath dist\SpeedView-windows-x64.zip -Force
          $zipHash = (Get-FileHash -Algorithm SHA256 dist\SpeedView-windows-x64.zip).Hash.ToLower()
          $setupHash = (Get-FileHash -Algorithm SHA256 dist\SpeedView-Setup.exe).Hash.ToLower()
          $msiHash = (Get-FileHash -Algorithm SHA256 dist\SpeedView-windows-x64.msi).Hash.ToLower()
          @(
            "$zipHash  SpeedView-windows-x64.zip"
            "$setupHash  SpeedView-Setup.exe"
            "$msiHash  SpeedView-windows-x64.msi"
          ) | Out-File -Encoding ascii dist\SpeedView-windows-x64.sha256

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: speedview-windows-x64
          path: |
            dist/SpeedView-Setup.exe
            dist/SpeedView-windows-x64.msi
            dist/SpeedView-windows-x64.zip
            dist/SpeedView-windows-x64.sha256

  build-macos:
    name: Build macOS App Bundle (PyInstaller)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify bytecode & run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q main.py installer.py speedview tests
          python -m unittest discover -s tests -v

      - name: Build standalone macOS .app.zip with PyInstaller
        run: |
          pyinstaller --noconfirm --clean speedview.spec
          ditto -c -k --keepParent dist/SpeedView.app dist/SpeedView-macos.zip
          (cd dist && shasum -a 256 SpeedView-macos.zip > SpeedView-macos.zip.sha256)

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: speedview-macos
          path: |
            dist/SpeedView-macos.zip
            dist/SpeedView-macos.zip.sha256

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lh release-assets

      - name: Create GitHub Release and attach binaries
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-assets/SpeedView-Setup.exe
            release-assets/SpeedView-windows-x64.msi
            release-assets/SpeedView-windows-x64.zip
            release-assets/SpeedView-windows-x64.sha256
            release-assets/SpeedView-linux-x64.tar.gz
            release-assets/SpeedView-linux-x64.zip
            release-assets/SpeedView-linux-x64-Setup
            release-assets/SpeedView-linux-x64.sha256
            release-assets/SpeedView-macos.zip
            release-assets/SpeedView-macos.zip.sha256
